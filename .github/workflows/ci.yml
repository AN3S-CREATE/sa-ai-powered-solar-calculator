name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, seed, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.11
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate export discovery
        run: npm run seed -- --dry-run

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Reject active Taskade cloud references
        shell: bash
        run: |
          if grep -RInE '(/api/taskade|files\.taskade\.com|/_taskade|/_genesis)' apps/default/src; then
            echo 'Active Taskade cloud reference detected.' >&2
            exit 1
          fi
